# GitHub Pages (Jekyll) settings.
# README.md files become the index page of their folder, and links between
# .md files are converted to links between the generated pages.
title: "UX in Visual Analytics – Instrument"
description: "Data, scripts and analysis reports for an instrument to evaluate the user experience of visual analytics systems"
theme: jekyll-theme-cayman

plugins:
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

# Not published on the site
# "*.Rmd": the R Markdown sources start with a YAML header, so Jekyll renders them as
# pages and fails on code such as "{%" (build error of 2026-11). The sources stay in
# the repository; the rendered .html reports are published.
exclude:
  - phase3-validation/data/raw
  - phase2-1-scale-development/data/raw
  - phase1-item-development/data/raw
  - "*.Rmd"
  - "*.Rproj"
  - renv/
  - renv.lock
  - requirements.txt
  - Gemfile
  - Gemfile.lock
